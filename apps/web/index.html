<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#141210" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>LinguaForge</title>
    <meta name="description" content="Entrenamiento intensivo de inglés para hispanohablantes: recuerdo activo, producción y video." />
    <style>
      /* Shown until the app mounts. Fixed, so replacing it can't shift the layout. */
      html { background: #141210; color: #f2efe9; }
      html:not(.dark) { background: #fbfaf8; color: #22201c; }
      .lf-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 1.25rem system-ui, sans-serif; }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8843c'/%3E%3Cpath d='M11 8v16h10' fill='none' stroke='%23201208' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Runs before first paint so light-mode users don't see a dark flash.
      // Keep the rule in sync with src/app/theme.ts.
      try {
        var mode = localStorage.getItem('lf-theme') || 'auto'
        var isLight =
          mode === 'light' ||
          (mode === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('dark', !isLight)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"><div class="lf-splash">LinguaForge</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
